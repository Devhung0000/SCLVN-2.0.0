<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:url" content="https://thespamchallengelistvietnam.pages.dev/"/>
        <meta property="og:title" content="The Spam Challenge List Vietnam" />
        <meta property="og:description" content="This is a website for the hardest spam challenges in Vietnam!" />
        <meta property="og:image" content="https://thespamchallengelistvietnam2.pages.dev//assets/the%20sclvn%20logo.png" />
        <title>The Spam Challenge List Vietnam</title>

        <link rel="icon" href="/assets/the sclvn logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>

        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #09090b !important;
                color: #ffffff !important;
                font-family: 'Poppins', sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
            }

            #app {
                display: flex;
                width: 100vw;
                min-height: 100vh;
                background-color: #09090b;
            }

            /* Sidebar Dọc */
            .sidebar {
                width: 64px;
                height: 100vh;
                background: #121215;
                border-right: 1px solid #27272a;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 15px 0;
                position: fixed;
                left: 0;
                top: 0;
                z-index: 1000;
                transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                overflow: hidden;
            }

            .sidebar:hover {
                width: 220px;
                align-items: flex-start;
                padding-left: 12px;
                box-shadow: 10px 0 30px rgba(0,0,0,0.8);
            }

            .sidebar-logo {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 0 8px;
                margin-bottom: 25px;
                text-decoration: none;
                color: white;
                width: 100%;
            }

            .sidebar-logo img {
                width: 36px;
                height: 36px;
                border-radius: 8px;
                flex-shrink: 0;
            }

            .sidebar-logo span {
                font-weight: 700;
                font-size: 16px;
                white-space: nowrap;
                opacity: 0;
                transition: opacity 0.2s;
            }

            .sidebar:hover .sidebar-logo span {
                opacity: 1;
            }

            .sidebar-nav {
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
            }

            .nav-item {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 12px;
                border-radius: 8px;
                color: #a1a1aa;
                text-decoration: none;
                font-size: 14px;
                font-weight: 500;
                white-space: nowrap;
                transition: all 0.2s;
                cursor: pointer;
                background: transparent;
                border: none;
                width: 100%;
                text-align: left;
                box-sizing: border-box;
            }

            .nav-item:hover, .nav-item.router-link-active {
                background: #27272a;
                color: #c084fc;
            }

            .nav-item svg, .nav-item img {
                width: 22px;
                height: 22px;
                flex-shrink: 0;
            }

            .nav-item-text {
                opacity: 0;
                transition: opacity 0.2s;
            }

            .sidebar:hover .nav-item-text {
                opacity: 1;
            }

            .sidebar-bottom {
                margin-top: auto;
                display: flex;
                flex-direction: column;
                gap: 8px;
                width: 100%;
                border-top: 1px solid #27272a;
                padding-top: 15px;
            }

            /* Container chính né Sidebar */
            .main-content {
                margin-left: 64px;
                flex: 1;
                width: calc(100vw - 64px);
                min-height: 100vh;
                box-sizing: border-box;
                background-color: #09090b;
            }
        </style>
    </head>
    <body id="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">
                <img src="/assets/the sclvn logo.png" alt="SCLVN Logo">
                <span>SCLVN v2.0</span>
            </a>

            <nav class="sidebar-nav">
                <router-link to="/" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                    <span class="nav-item-text">List</span>
                </router-link>

                <router-link to="/leaderboard" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                    <span class="nav-item-text">Leaderboard</span>
                </router-link>

                <router-link to="/roulette" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span class="nav-item-text">Roulette</span>
                </router-link>

                <router-link to="/statistics" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path></svg>
                    <span class="nav-item-text">Statistics</span>
                </router-link>

                <router-link to="/submit" class="nav-item">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span class="nav-item-text">Submit Record</span>
                </router-link>

                <a href="https://discord.gg/Qcj5JSRKa" target="_blank" class="nav-item">
                    <img src="/assets/discord.svg" style="filter: invert(1);" alt="Discord">
                    <span class="nav-item-text">Discord Server</span>
                </a>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item" @click.prevent="store.toggleDark()">
                    <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" style="filter: invert(1);" alt="Theme">
                    <span class="nav-item-text">Toggle Theme</span>
                </button>

                <router-link v-if="!store.user" to="/login" class="nav-item" style="color: #c084fc;">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                    <span class="nav-item-text">Login / Register</span>
                </router-link>

                <template v-else>
                    <router-link to="/profile" class="nav-item">
                        <img :src="store.user.avatar || '/assets/the sclvn logo.png'" style="border-radius: 50%; object-fit: cover;">
                        <span class="nav-item-text">{{ store.user.username }}</span>
                    </router-link>

                    <button @click="store.handleLogout()" class="nav-item" style="color: #ef4444;">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                        <span class="nav-item-text">Logout</span>
                    </button>
                </template>
            </div>
        </aside>

        <!-- Main Content Wrapper -->
        <main class="main-content">
            <router-view></router-view>
        </main>
    </body>
</html>
