<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:url" content="https://thespamchallengelistvietnam.pages.dev/"/>
        <meta property="og:title" content="The Spam Challenge List Vietnam" />
        <meta property="og:description" content="This is a website for the hardest spam challenges in Vietnam!" />
        <meta property="og:image" content="https://thespamchallengelistvietnam2.pages.dev/assets/the%20sclvn%20logo.png" />
        <title>The Spam Challenge List Vietnam</title>

        <link rel="icon" href="/assets/the sclvn logo.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>

        <style>
            * {
                box-sizing: border-box;
            }

            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: 100vh !important;
                background-color: #0b0b0e !important;
                overflow-x: hidden !important;
            }

            body#app {
                display: block !important; /* Đổi sang block để tránh flex ép bẹp sidebar */
                min-height: 100vh;
                background-color: #0b0b0e !important;
                color: #ffffff;
                position: relative;
            }

            /* --- CẤU HÌNH SIDEBAR CỐ ĐỊNH HOÀN TOÀN --- */
            aside.sidebar {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                height: 100vh !important;
                width: 65px !important;
                background-color: #121216 !important;
                border-right: 1px solid #23232b !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
                overflow: hidden !important;
                z-index: 9999999 !important; /* Đảm bảo nổi cao nhất */
                padding: 12px 8px !important;
                box-sizing: border-box !important;
                pointer-events: auto !important;
            }

            /* Hover mở rộng Sidebar */
            aside.sidebar:hover {
                width: 240px !important;
            }

            .sidebar-logo {
                display: flex !important;
                align-items: center !important;
                gap: 12px !important;
                padding: 8px 6px !important;
                margin-bottom: 20px !important;
                height: 40px !important;
            }

            .sidebar-logo img {
                width: 32px !important;
                height: 32px !important;
                border-radius: 8px !important;
                flex-shrink: 0 !important;
                object-fit: cover !important;
            }

            .sidebar-logo-text {
                display: flex !important;
                align-items: baseline !important;
                gap: 6px !important;
                opacity: 0 !important;
                white-space: nowrap !important;
                transition: opacity 0.2s ease !important;
            }

            aside.sidebar:hover .sidebar-logo-text {
                opacity: 1 !important;
            }

            .sidebar-nav {
                display: flex !important;
                flex-direction: column !important;
                gap: 6px !important;
            }

            .sidebar-item {
                display: flex !important;
                align-items: center !important;
                gap: 14px !important;
                padding: 10px 12px !important;
                border-radius: 8px !important;
                color: #a1a1aa !important;
                text-decoration: none !important;
                white-space: nowrap !important;
                transition: background-color 0.2s ease, color 0.2s ease !important;
                cursor: pointer !important;
                background: none;
                border: none;
                width: 100% !important;
                box-sizing: border-box !important;
            }

            .sidebar-item:hover, .sidebar-item.router-link-exact-active {
                background-color: #1e1e24 !important;
                color: #ffffff !important;
            }

            .sidebar-icon {
                font-size: 18px !important;
                width: 24px !important;
                height: 24px !important;
                display: flex !important;
                justify-content: center !important;
                align-items: center !important;
                flex-shrink: 0 !important;
            }

            .sidebar-icon img {
                width: 20px !important;
                height: 20px !important;
                object-fit: contain !important;
            }

            .sidebar-label {
                opacity: 0 !important;
                transition: opacity 0.2s ease !important;
                font-weight: 500 !important;
                font-size: 14px !important;
            }

            aside.sidebar:hover .sidebar-label {
                opacity: 1 !important;
            }

            .sidebar-footer {
                display: flex !important;
                flex-direction: column !important;
                gap: 6px !important;
                padding-top: 12px !important;
                border-top: 1px solid #23232b !important;
            }

            .user-info-box {
                display: flex !important;
                align-items: center !important;
                gap: 12px !important;
                padding: 6px !important;
            }

            .user-avatar {
                width: 30px !important;
                height: 30px !important;
                border-radius: 50% !important;
                object-fit: cover !important;
                border: 1px solid #a855f7 !important;
                flex-shrink: 0 !important;
            }

            /* --- CẤU HÌNH MAIN CONTENT NẰM BÊN PHẢI --- */
            main.main-content {
                margin-left: 65px !important;
                width: calc(100% - 65px) !important;
                min-height: 100vh !important;
                padding: 1.5rem !important;
                box-sizing: border-box !important;
                position: relative !important;
                z-index: 1 !important;
                display: block !important;
            }

            .page-container, .list-container, .leaderboard-container, .page-auth {
                width: 100% !important;
                max-width: 1200px !important;
                margin: 0 auto !important;
            }
        </style>
    </head>
    
    <body id="app">
        <aside class="sidebar" :class="{ dark: store.dark, 'darker': store.darker }">
            <div>
                <div class="sidebar-logo">
                    <a href="https://thespamchallengelistvietnam2.pages.dev/">
                        <img src="/assets/the sclvn logo.png" alt="SCLVN Logo" />
                    </a>
                    <div class="sidebar-logo-text">
                        <h2 style="margin: 0; font-size: 16px; color: #fff;">SCLVN</h2>
                        <span style="font-size: 11px; color: #888;">v2.0</span>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <router-link class="sidebar-item" to="/">
                        <span class="sidebar-icon">📋</span>
                        <span class="sidebar-label">List</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/leaderboard">
                        <span class="sidebar-icon">🏆</span>
                        <span class="sidebar-label">Leaderboard</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/roulette">
                        <span class="sidebar-icon">🎰</span>
                        <span class="sidebar-label">Roulette</span>
                    </router-link>

                    <router-link class="sidebar-item" to="/submit">
                        <span class="sidebar-icon">📤</span>
                        <span class="sidebar-label">Submit Record</span>
                    </router-link>

                    <router-link v-if="store.user && store.user.role === 'admin'" class="sidebar-item" to="/admin" style="color: #ef4444 !important;">
                        <span class="sidebar-icon">🛡️</span>
                        <span class="sidebar-label">Duyệt Record</span>
                    </router-link>
                </nav>
            </div>

            <div class="sidebar-footer">
                <button class="sidebar-item" @click.prevent="store.toggleDark()">
                    <span class="sidebar-icon">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="Theme" />
                    </span>
                    <span class="sidebar-label">Đổi Giao Diện</span>
                </button>

                <a class="sidebar-item" href="https://discord.gg/Qcj5JSRKa" target="_blank" rel="noopener noreferrer">
                    <span class="sidebar-icon">
                        <img src="/assets/discord.svg" alt="Discord" />
                    </span>
                    <span class="sidebar-label">Discord Server</span>
                </a>

                <div v-if="!store.user">
                    <router-link to="/login" class="sidebar-item" style="background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%) !important; color: #fff !important;">
                        <span class="sidebar-icon">🔑</span>
                        <span class="sidebar-label">Login / Register</span>
                    </router-link>
                </div>

                <template v-else>
                    <div class="user-info-box">
                        <img :src="store.user.avatar || '/assets/the sclvn logo.png'" class="user-avatar" alt="Avatar">
                        <div class="sidebar-label" style="display: flex; flex-direction: column;">
                            <span style="color: #ffffff; font-weight: 700; font-size: 13px;">
                                {{ store.user.username || store.user.displayName || 'Player' }}
                            </span>
                            <span v-if="store.user.role === 'admin'" style="color: #ef4444; font-size: 10px; font-weight: bold;">ADMIN</span>
                        </div>
                    </div>

                    <router-link to="/profile" class="sidebar-item">
                        <span class="sidebar-icon">👤</span>
                        <span class="sidebar-label">Profile</span>
                    </router-link>

                    <button @click="store.handleLogout()" class="sidebar-item" style="color: #ef4444 !important;">
                        <span class="sidebar-icon">🚪</span>
                        <span class="sidebar-label">Logout</span>
                    </button>
                </template>
            </div>
        </aside>

        <main class="main-content">
            <router-view :class="{ dark: store.dark, 'darker': store.darker }"></router-view>
        </main>
    </body>
</html>
